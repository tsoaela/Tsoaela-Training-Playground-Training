    <script>
      (function() {
        // Intercept Vite client HMR WebSockets in AI Studio iframe environment where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (protocols === 'vite-hmr' || url.includes('/?token=') || url.includes('token='))) {
              var fakeWs = {
                readyState: 3, // CLOSED
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  // Never trigger rejection for close on un-opened socket
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return false; }
              };
              return fakeWs;
            }
            return new (Function.prototype.bind.apply(OrigWebSocket, [null].concat(Array.prototype.slice.call(arguments))))();
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        }

        // Catch unhandled errors and rejections related to HMR
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack)) || String(reason || '');
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || msg.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
